[project]
name = "vuln-triage"
version = "0.1.0"
description = "Automated vulnerability triage using Code Property Graphs and LLMs"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "litellm>=1.80,<1.82",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
vuln-triage = "vuln_triage.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
